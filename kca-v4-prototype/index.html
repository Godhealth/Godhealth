const storageKey="godhealth-kca-v4-prototype-draft";let answers={};try{answers=JSON.parse(localStorage.getItem(storageKey)||"{}")||{}}catch(e){answers={}}let current=0;let lastQuestionId=null;const root=document.getElementById("app");const bar=document.getElementById("bar");
const visible=()=>questions.filter(x=>!x.condition||x.condition(answers));
function render(){root.dataset.transitioning="no";const list=visible();if(current>=list.length){finish();return}const x=list[current];if(lastQuestionId!==x.id){lastQuestionId=x.id;const active=document.activeElement;if(active&&active.blur)active.blur()}bar.style.width=(current/list.length*100)+"%";let choices=x.options?'<div class="choices">'+x.options.map((v,i)=>'<button class="choice '+(answers[x.id]===v?'selected':'')+'" data-i="'+i+'">'+escapeHtml(v)+'</button>').join("")+'</div>':'<label><span class="muted">Your answer</span><textarea rows="3" id="free" placeholder="Type your answer here...">'+escapeHtml(answers[x.id]||"")+'</textarea></label>';
root.innerHTML='<article><small>'+escapeHtml(x.section)+' · '+(current+1)+' / '+list.length+'</small><h1>'+escapeHtml(x.title)+'</h1>'+choices+'<p class="hint">'+(x.required?"Required":"Optional — you can skip this question")+'</p><div class="nav"><button class="secondary" id="back" '+(current===0?'disabled':'')+'>Back</button><button id="next">Continue</button></div></article>';
document.getElementById("back").onclick=()=>{current=Math.max(0,current-1);render()};document.getElementById("next").onclick=()=>{if(!x.options){answers[x.id]=document.getElementById("free").value.trim()}if(x.required&&!answers[x.id]){alert("Please answer this question.");return}if(["PR1","PR3","PR4","GL5"].includes(x.id)&&answers[x.id]){const n=Number(String(answers[x.id]).replace(",","."));const ranges={PR1:[18,100],PR3:[100,250],PR4:[30,400],GL5:[30,400]};const [min,max]=ranges[x.id];if(!Number.isFinite(n)||n<min||n>max){alert("Please enter a valid number ("+min+"–"+max+").");return}answers[x.id]=String(n)}advance()};
root.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{if(root.dataset.transitioning==="yes")return;root.dataset.transitioning="yes";answers[x.id]=x.options[Number(b.dataset.i)];root.querySelectorAll("[data-i]").forEach(option=>{option.disabled=true;option.classList.remove("selected")});b.classList.add("selected");b.blur();try{localStorage.setItem(storageKey,JSON.stringify(answers))}catch(e){}window.setTimeout(()=>{root.dataset.transitioning="no";advance()},420)});
}
function advance(){try{localStorage.setItem(storageKey,JSON.stringify(answers))}catch(e){}const x=visible()[current];if(x.id==="G5"&&answers.G5!=="No"){root.innerHTML='<article><h1>Your safety comes first</h1><div class="warning">If you are in immediate danger or experiencing a mental-health emergency, contact your local emergency service or qualified crisis service now. A GodHealth assessment is not emergency care.</div><p>Normal automated recommendations are paused. Please discuss next steps with a qualified professional.</p><button class="primary" onclick="location.reload()">Restart prototype</button></article>';return}current++;render()}
function downloadDraft(){const payload={prototype_version:"v4-preview-0.2",exported_at:new Date().toISOString(),answers};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="godhealth-v4-test-answers.json";a.click();URL.revokeObjectURL(url)}function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function downloadReport(){const button=document.querySelector("button.primary");if(button){button.disabled=true;button.textContent="Checking USDA nutrient data..."}let html;try{html=await window.GodHealthUSDA.report(answers)}catch(e){html=window.GodHealthV4.reportHtml(answers);alert("USDA nutrient verification unavailable. The report will clearly label unverified estimates.")}finally{if(button){button.disabled=false;button.textContent="Download personalized plan (save as PDF)"}}const blob=new Blob([html],{type:"text/html;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="godhealth-v4-coach-review-report.html";a.click();URL.revokeObjectURL(url)}
function finish(){try{localStorage.setItem(storageKey,JSON.stringify(answers))}catch(e){}bar.style.width="100%";const count=core.filter(([id])=>answers[id]!==undefined).length;const report=window.GodHealthV4.plan(answers);const scores=report.scores.pillars.map(p=>'<div class="warning">'+escapeHtml(p.name)+': '+(p.value===null?'Incomplete':p.value+'/100')+'</div>').join("");root.innerHTML='<article><small>GODHEALTH · V4 PREVIEW</small><h1>Your Kingdom Capacity Results</h1><p>'+count+' of 24 capacity answers recorded. Overall score: '+(report.scores.overall===null?'Incomplete':report.scores.overall+'/100')+'</p>'+scores+'<div class="warning"><b>'+(report.review?'Safety review required':'Coach approval required')+'</b><p>'+escapeHtml(report.disclaimer)+'</p><p>Review items: '+escapeHtml(report.flags.join(", ")||"None reported")+'</p></div><h2>Your draft plan is ready to preview</h2><p>Includes a 12-week Body, Soul & Spirit roadmap, 7-day meal schedule, and home/gym training sessions. It is not approved for client use until a coach checks it.</p><button class="primary" onclick="downloadReport()">Download personalized plan (save as PDF)</button> <button class="secondary" onclick="downloadDraft()">Export answers (JSON)</button> <button class="secondary" onclick="localStorage.removeItem(storageKey);location.reload()">Start again</button><p>Your answers remain in this browser only. No client records were changed.</p></article>'}

render();
